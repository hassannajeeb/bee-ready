<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Bee Ready</title>
<meta name="description" content="Practice and mock Pakistan Spelling Bee rounds for Grade 3 and Grade 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one centred column (max 760px); a top bar with speller switcher, then one screen at a time. Letters always sit on honey hex tiles. */
:root{
  --ground:#F1F5EF; --surface:#FFFFFF; --sunk:#E6EDE5; --ink:#11261B; --muted:#56695D; --line:#D3DDD4;
  --accent:#0B5D3B; --accent-ink:#FFFFFF; --honey:#F4B41A; --honey-ink:#3A2700; --honey-soft:#FCEBBE;
  --good:#1D7F47; --good-soft:#DDF1E3; --bad:#B63A24; --bad-soft:#F8E0DA; --warn:#9A6A00;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-letter:"Andika","Atkinson Hyperlegible","Comic Sans MS",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1912; --surface:#14241B; --sunk:#1B2E23; --ink:#E7F0E9; --muted:#9DB2A4; --line:#2A3E32;
    --accent:#45C487; --accent-ink:#06170E; --honey:#F5BE3A; --honey-ink:#2B1D00; --honey-soft:#3A2F12;
    --good:#5AD08C; --good-soft:#163524; --bad:#FF8A73; --bad-soft:#3A1C16; --warn:#F2C35B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1912; --surface:#14241B; --sunk:#1B2E23; --ink:#E7F0E9; --muted:#9DB2A4; --line:#2A3E32;
  --accent:#45C487; --accent-ink:#06170E; --honey:#F5BE3A; --honey-ink:#2B1D00; --honey-soft:#3A2F12;
  --good:#5AD08C; --good-soft:#163524; --bad:#FF8A73; --bad-soft:#3A1C16; --warn:#F2C35B;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;background:none;border:0;padding:0}
.brand .hex{width:30px;height:34px;font-size:1rem}
.who{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* hex letter tiles */
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.hex{width:44px;height:50px;display:inline-grid;place-items:center;background:var(--honey);color:var(--honey-ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-family:var(--f-letter);font-weight:700;font-size:1.45rem;text-transform:lowercase}
.hex.miss{background:var(--bad);color:#fff}
.hex.ok{background:var(--good);color:#fff}
.hex.blank{background:var(--sunk);color:var(--muted)}
.tiles.sm .hex{width:32px;height:36px;font-size:1.05rem}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;flex-direction:column;gap:14px;padding-block:10px 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.grid3{grid-template-columns:1fr}}

.action{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.action:hover{border-color:var(--accent);transform:translateY(-2px)}
.action h3{display:flex;align-items:center;gap:8px}
.action .hex{width:26px;height:30px;font-size:.95rem}
.action p{color:var(--muted);font-size:.95rem}

.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1rem;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.honey{background:var(--honey);color:var(--honey-ink)}
.btn.big{padding:16px 26px;font-size:1.12rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}

/* meters */
.meter{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;font-size:.95rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* spelling input */
.spell{width:100%;font-family:var(--f-letter);font-size:2rem;letter-spacing:.12em;text-align:center;padding:14px;border:2.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.spell:focus{border-color:var(--accent);outline:none}
.speak{width:118px;height:118px;border-radius:50%;border:0;background:var(--honey);color:var(--honey-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1rem;box-shadow:0 6px 0 color-mix(in srgb,var(--honey) 60%,#000)}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--honey) 60%,#000)}
.speak svg{width:40px;height:40px}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

.note{border-radius:12px;padding:14px 16px;background:var(--sunk);font-size:.96rem}
.note.good{background:var(--good-soft)} .note.bad{background:var(--bad-soft)} .note.honey{background:var(--honey-soft)}
.big-result{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.big-result.good{color:var(--good)} .big-result.bad{color:var(--bad)}

/* timer */
.timer{display:flex;flex-direction:column;gap:8px;width:100%}
.timer .track{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.timer .seg-t{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.timer .seg-t i{display:block;height:100%;width:0;background:var(--accent)}
.timer .seg-t.spell i{background:var(--honey)}
.timer .labels{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:.82rem;color:var(--muted);font-weight:700}
.secs{font-family:var(--f-display);font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.phase{font-weight:700;padding:6px 14px;border-radius:99px;background:var(--good-soft);color:var(--good)}
.phase.spell{background:var(--honey-soft);color:var(--warn)}
.phase.over{background:var(--bad-soft);color:var(--bad)}

/* judge */
.judge-word{font-family:var(--f-letter);font-size:2.2rem;font-weight:700;letter-spacing:.04em}
.judge-word.hidden{filter:blur(12px);user-select:none}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.outcomes{grid-template-columns:1fr}}
.oc{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.oc .pts{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.oc.plus .pts{color:var(--good)} .oc.minus .pts{color:var(--bad)}
.oc:hover{border-color:var(--accent)}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface)}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
td .w{font-family:var(--f-letter);font-weight:700}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.honey{background:var(--honey-soft);color:var(--warn)}
.scorebox{display:flex;gap:24px;flex-wrap:wrap}
.scorebox div{display:flex;flex-direction:column}
.scorebox b{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}

/* word bank */
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.bw{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-family:var(--f-letter);font-size:1.02rem}
.bw .st{width:10px;height:10px;border-radius:3px;flex:none}
.st.new{background:var(--line)} .st.learning{background:var(--honey)} .st.tricky{background:var(--bad)} .st.mastered{background:var(--good)}

.hist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0}
.mic{min-width:220px}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
.heard{min-height:2.6em;max-width:560px;font-family:var(--f-letter);font-size:1.25rem;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:10px;align-items:baseline}
.checks li span{font-weight:700;width:1.2em}
.checks li.yes span{color:var(--good)} .checks li.no span{color:var(--bad)}
.oc[aria-pressed="true"]{border-color:var(--accent);background:var(--sunk)}
.meaning{display:flex;flex-direction:column;gap:8px;text-align:left}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{padding:8px 16px;font-size:.95rem}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.lt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.lt b{font-family:var(--f-letter);font-size:1.2rem}
.lt small{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lt.all{grid-column:span 3;flex-direction:row;justify-content:center;font-weight:700;font-size:.92rem}
.lt[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--honey-ink)}
.lt[aria-pressed="true"] small{color:var(--honey-ink)}
.lt:disabled{opacity:.35;cursor:not-allowed}
.override{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px;border-top:1px dashed var(--line)}
.override .muted{font-size:.88rem}
.credit{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop .hex{animation:pop .28s ease-out both}
</style>

<div class="wrap">
  <header class="bar">
    <button class="brand" data-act="home" aria-label="Bee Ready home"><span class="hex">b</span>Bee Ready</button>
    <nav class="who" id="who" aria-label="Choose speller"></nav>
  </header>
  <main id="app" class="wrap"></main>
</div>

function parse(text, src){
  return text.trim().split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts = l.split(/\s+OR\s+/i).map(p=>p.trim().toLowerCase());
    const key = parts[0];
    const answers = [...new Set([...parts, ...(EXTRA[key]||[])])];
    const word = PROPER.has(key) ? key[0].toUpperCase()+key.slice(1) : key;
    return {key, word, answers, alts: answers.slice(1), src};
  });
}

/* Letters of the correct word that the attempt missed, via longest common subsequence. */
function missMarks(correct, attempt){
  const a=[...correct], b=[...norm(attempt)], n=a.length, m=b.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]= a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const keep=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){keep[i]=true;i++;j++;} else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return `<div class="tiles">${a.map((ch,k)=>`<span class="hex ${keep[k]?'':'miss'}">${esc(ch)}</span>`).join('')}</div>`;
}

function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  let c = vs.filter(v=>v.lang.replace('_','-').startsWith(S.settings.accent));
  if(!c.length) c = vs.filter(v=>v.lang.startsWith('en'));
  return c.find(v=>/Google|Enhanced|Premium|Daniel|Serena|Samantha|Karen|Moira/i.test(v.name)) || c[0] || null;
}

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if(v){u.voice=v; u.lang=v.lang;} else u.lang=S.settings.accent;
  u.rate = slow ? 0.55 : S.settings.rate;
  speechSynthesis.speak(u);
}

function tone(freq, dur, times=1){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*(dur+0.1);
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
    }
  }catch(e){}
}

function heardItems(text){
  const toks = [];
  text.toLowerCase().replace(/[.,!?;:"“”]/g,' ').split(/\s+/).filter(Boolean).forEach(t=>{
    if(/^([a-z]-)+[a-z]$/.test(t)) toks.push(...t.split('-')); else toks.push(t.replace(/['’]s$/,''));
  });
  const items = [];
  for(let i=0;i<toks.length;i++){
    const t = toks[i];
    if(t==='double' && i+1<toks.length){
      const nx = toks[i+1];
      if(nx==='u'||nx==='you'){ items.push({t:'double u', l:'w'}); i++; continue; }
      const L = LETTER[nx] || (/^[a-z]$/.test(nx)?nx:null);
      if(L){ items.push({t:'double '+nx, l:L+L}); i++; continue; }
    }
    items.push({t, l: LETTER[t] || (/^[a-z]$/.test(t)?t:null), filler: FILLERS.has(t)});

  }
  const letters = attempt ? attempt.l : '';
  const extra = attempt ? attempt.seg.filter(x=>!x.l && !x.filler).map(x=>x.t) : [];
  const fillers = mid.filter(x=>x.filler).map(x=>x.t);
  return {text, letters, saidFirst:before.length>0, saidLast:after.length>0, extra, fillers,

// iPhone and iPad browsers all use Safari's engine: it keeps listening through pauses on its own, and
// restarting the microphone there can bring up the permission prompt again.
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
/* Each session keeps its own handlers, so a late event from an earlier word can't touch the current one. */
function startListening(onDone){
  stopListening(true);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(player) player.pause();
  const rec = new SR();
  rec.lang = S.settings.accent; rec.continuous = true; rec.interimResults = true;
  const sess = {rec, prior:'', fin:'', live:'', onDone, done:false, stopping:false, began:Date.now(), silence:null, error:null, fallback:null};
  L = sess;
  rec.onresult = e=>{
    if(sess.done) return;
    // Chrome on Android can resend everything heard so far as one longer result; keep the longer one instead of doubling it.
    let fin='', live='';
    for(let i=0;i<e.results.length;i++){
      const r=e.results[i], t=r[0].transcript.trim();
      if(!t) continue;
      if(!r.isFinal){ live=(live+' '+t).trim(); continue; }
      fin = fin && t.length>fin.length && t.toLowerCase().startsWith(fin.toLowerCase()) ? t : (fin+' '+t).trim();
    }
    sess.fin=(sess.prior+' '+fin).trim(); sess.live=live;
    const h=$('#heard'); if(h) h.textContent=displayHeard((fin+live).trim(), listenAnswers());
    clearTimeout(sess.silence); sess.silence=setTimeout(()=>stopListening(false), 4000);
  };
  rec.onerror = e=>{ sess.error=e.error; };
  rec.onend = ()=>{
    if(sess.done) return;
    // Chrome on Android stops after each pause even when asked to keep listening. Start again and keep
    // what was heard, until "I'm done", 4 s of silence, an error, or 40 s in total.
    if(!IOS && !sess.stopping && !sess.error && Date.now()-sess.began < 40000){
      sess.prior = (sess.fin+' '+sess.live).trim(); sess.fin = sess.prior; sess.live = '';
      try{ rec.start(); return; }catch(e){}
    }
    finishListening(sess);
  };
  try { rec.start(); } catch(e){ L=null; onDone('', 'start-failed'); return; }

}
function stopListening(discard){
  const sess = L;
  if(!sess || sess.done) return;
  clearTimeout(sess.silence);
  if(discard){ sess.done=true; clearTimeout(sess.fallback); try{sess.rec.abort();}catch(e){} L=null; return; }
  if(sess.stopping) return;
  sess.stopping = true;
  micUI('stopping');
  try{ sess.rec.stop(); }catch(e){}

  sess.fallback = setTimeout(()=>{ try{sess.rec.abort();}catch(e){} finishListening(sess); }, 1500);
}
function finishListening(sess){
  if(!sess || sess.done) return;
  sess.done=true; clearTimeout(sess.silence); clearTimeout(sess.fallback);

      body = `<div class="center"><div class="big-result ${ok&&P.heard.procOk?'good':'bad'}">${ok?(P.heard.procOk?'Correct!':'Right spelling, check the procedure'):'Not quite'}</div>
        ${ok?tiles(w.key,'pop'):missMarks(w.key, P.heard.letters||'')}</div>
        ${heardHtml(P.heard, w)}
        <div class="row" style="justify-content:center"><button class="btn big" data-act="pMicNext" id="nextbtn">Next word</button><button class="btn alt" data-act="pMicAgain">Spell it again</button></div>
        ${ok&&P.heard.procOk?'':`<div class="override"><button class="btn honey" data-act="pMicOverride">✓ Said it correctly</button><span class="muted">Use this if the listening made a mistake.</span></div>`}`;
    }
  } else {
    if(P.phase==='ask') body = `
      <div class="note honey" style="text-align:center"><b>Say</b> the word, <b>SPELL</b> it letter by letter, <b>say</b> it again.<br><span class="muted">No "um" or "uh", and don't sound out syllables.</span></div>
      <div class="row" style="justify-content:center"><button class="btn big" data-act="pReveal">Show the spelling</button></div>`;
    else body = `
      <div class="center">${tiles(w.key,'pop')}${w.alts.length?`<p class="muted">Also correct: ${esc(w.alts.join(', '))}</p>`:''}
      <p>Did you spell it right?</p>
      <div class="row" style="justify-content:center"><button class="btn big" data-act="pSelf" data-ok="1">I got it</button><button class="btn big alt" data-act="pSelf" data-ok="0">I missed it</button></div></div>`;
  }
  return `${head}<section class="panel">${ear}${body}</section>`;
}
function pHeard(text, err){
  if(!P || view!=='practice') return;
  if(!text){ P.msg = micError(err); render(); return; }
  P.msg = ''; P.heard = parseHeard(text, P.q[P.i].answers); P.phase = 'heard'; render();
}
function pAdvance(){
  P.i++; P.phase='ask'; P.attempt=''; P.msg=''; P.heard=null;
  if(P.i>=P.q.length){ go('pDone'); return; }
  render(); sayWord(P.q[P.i].key);
}
function vPracticeDone(){
  const n = P.i>=P.q.length ? P.q.length : P.i;
  return `${backBar()}
  <section class="hero"><span class="eyebrow">Practice finished</span><h1>${P.right} of ${n} right first time</h1>
  ${tiles(P.right===n&&n?'super':'good','pop')}</section>
  ${P.missed.length?`<section class="panel"><h3>Words to work on</h3><p class="muted">These are marked tricky and come back first next time.</p>
    <div class="bank">${P.missed.map(w=>`<button class="bw" data-act="say" data-text="${esc(w.key)}"><span>${esc(w.word)}</span><span class="st tricky"></span></button>`).join('')}</div></section>`
    :`<section class="note good">No mistakes this time.</section>`}
  <div class="row"><button class="btn big" data-act="pStart">Practise again</button><button class="btn alt" data-act="home">Home</button></div>`;
}

/* ---------- Mock bee ---------- */
const ROUNDS = 3, PER_ROUND = 10, OFFICIAL_PER_ROUND = 7, QUALIFY = 16;
const OUTCOMES = {
  ok:{label:'Correct spelling, correct procedure', pts:2},
  proc:{label:'Correct spelling, wrong procedure', pts:0},
  wrong:{label:'Incorrect spelling', pts:-1},
  none:{label:'No answer', pts:-1},
};
function vMockSetup(){

  <section class="hero"><span class="eyebrow">Mock bee · Grade ${p.grade}</span><h1>Regional Championship mock</h1>

    <p class="muted" style="font-size:.95rem">${{

      solo:'The speller types each answer before the 40 seconds run out. Procedure cannot be checked, so a correct spelling scores 2.'}[mode]}</p>

  </section>

  <div class="row"><button class="btn big" data-act="mStart">Start Round 1</button></div>`;
}
function buildRound(){
  const p = prof(), W = WORDS[p.grade];
  const pick = (arr, n) => shuffle(arr.filter(w=>!M.used.has(w.key))).slice(0,n);
  const words = shuffle([...pick(W.official, OFFICIAL_PER_ROUND), ...pick(W.hidden, PER_ROUND-OFFICIAL_PER_ROUND)]);
  words.forEach(w=>M.used.add(w.key));
  return {words, results:[]};
}
function startMock(){
  M = {mode:(S.settings.mMode==='listen'&&!canListen)?'judge':S.settings.mMode, used:new Set(), rounds:[], r:0, i:0, done:null, show:false};
  M.rounds.push(buildRound());
  go('mock'); beginWord();
}
const roundScore = r => r.results.reduce((s,x)=>s+x.pts,0);
const cumScore = () => M.rounds.reduce((s,r)=>s+roundScore(r),0);

/* Timer: 40 s with a signal at 20 s (Procedural Rules 2–4). */
let T = null;
function stopTimer(){ if(T){ clearInterval(T.h); T=null; } }
function beginWord(){
  M.done = null; M.show = false; M.heard = null; M.msg = '';
  render();
  sayWord(curWord().key);
  startTimer();
}
function startTimer(){
  stopTimer();
  T = {start:performance.now(), phase:'consult', h:null};
  T.h = setInterval(tick, 100); tick();
}
function tick(){
  if(!T) return;
  const el = (performance.now()-T.start)/1000;
  const a = $('#t1'), b = $('#t2'), secs = $('#secs'), ph = $('#phase');
  if(a) a.style.width = Math.min(100, el/20*100)+'%';
  if(b) b.style.width = Math.max(0, Math.min(100, (el-20)/20*100))+'%';
  if(secs) secs.textContent = Math.max(0, Math.ceil(40-el));
  if(el>=20 && T.phase==='consult'){
    T.phase='spell'; tone(880,0.18,2);
    document.querySelectorAll('[data-consult]').forEach(x=>x.disabled=true);
    if(M.mode==='listen' && !L) setTimeout(()=>{ if(view==='mock' && !M.done && !L) startListening(mHeard); }, 700);
  }
  if(el>=40){
    T.phase='over'; tone(330,0.6,1);
    clearInterval(T.h);
    if(M.mode==='solo'){ const v=($('#spell')||{}).value||''; mSolo(v, true); }
    if(M.mode==='listen'){
      // Rule 11: a speller who has already started may finish.
      if(!L) mResult('none','');
      else if(!(L.fin+L.live).trim()){ stopListening(true); mResult('none',''); }
    }
  }
  if(ph){ const t={consult:['Consult and ask questions','phase'], spell:['Spell now. No talking.','phase spell'], over:['Time is up','phase over']}[T.phase]; ph.textContent=t[0]; ph.className=t[1]; }
}
const curWord = () => M.rounds[M.r].words[M.i];

function vMock(){
  const R = M.rounds[M.r], w = curWord(), hint = HINTS[w.key];
  const head = `<div class="topnav"><button class="btn ghost back" data-act="mQuit">Quit mock</button></div>
  <div class="row spread"><span class="eyebrow">Round ${M.r+1} · word ${M.i+1} of ${PER_ROUND}</span>
    <span class="row" style="gap:8px"><span class="pill">Round ${roundScore(R)}</span><span class="pill good">Total ${cumScore()}</span></span></div>`;
  if(M.done){
    const d = M.done;
    return `${head}<section class="panel center">
      <div class="big-result ${d.pts>0?'good':'bad'}">${d.pts>0?'+':''}${d.pts} · ${esc(OUTCOMES[d.outcome].label)}</div>
      ${d.outcome==='wrong' && d.answer ? missMarks(w.key, d.answer) : tiles(w.key,'pop')}
      ${d.answer?`<p class="muted">Answer given: <b style="font-family:var(--f-letter);color:var(--ink)">${esc(d.answer)}</b></p>`:''}
      ${w.src==='hidden'?'<span class="pill honey">Hidden-list word</span>':'<span class="pill">Official-list word</span>'}
      ${M.heard?`<div style="width:100%;text-align:left;display:flex;flex-direction:column;gap:12px">${heardHtml(M.heard, w)}
        <details><summary>Change the score (grown-up)</summary><div class="outcomes" style="margin-top:10px">${Object.entries(OUTCOMES).map(([k,o])=>`<button class="oc ${o.pts>0?'plus':'minus'}" data-act="mOverride" data-o="${k}" aria-pressed="${d.outcome===k}"><span>${o.label}</span><span class="pts">${o.pts>0?'+':''}${o.pts}</span></button>`).join('')}</div></details></div>`:''}
      <button class="btn big" data-act="mNext" id="nextbtn">${M.i+1<PER_ROUND?'Next word':'See round marksheet'}</button>
    </section>`;
  }
  const late = T && T.phase!=='consult' ? 'disabled' : '';
  const consultBtns = `
    <div class="row" style="justify-content:center">
      <button class="btn alt" data-consult data-act="say" data-text="${esc(w.key)}" ${late}>Repeat the word</button>
      <button class="btn alt" data-consult data-act="meaning" ${late}>Meaning</button>
    </div>
    <div id="meaning" hidden class="note honey meaning">${meaningHtml(w)}</div>`;
  const timer = `
    <div class="center"><span class="secs" id="secs">40</span><span class="phase" id="phase">Consult and ask questions</span></div>
    <div class="timer"><div class="track"><div class="seg-t"><i id="t1"></i></div><div class="seg-t spell"><i id="t2"></i></div></div>
    <div class="labels"><span>0–20 s · may consult</span><span>20–40 s · spell only</span></div></div>`;
  if(M.mode==='solo'){
    return `${head}<section class="panel">${timer}
      <div class="center"><button class="speak" data-consult data-act="say" data-text="${esc(w.key)}" aria-label="Hear the word" ${late}>${SPEAKER}</button></div>
      ${consultBtns}
      <input class="spell" id="spell" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the spelling" data-enter="mSubmit">
      <div class="row" style="justify-content:center"><button class="btn big" data-act="mSubmit">Submit spelling</button></div>
      <p class="muted" style="text-align:center;font-size:.9rem">Once you submit, you cannot change it.</p>
    </section>
    <div class="row"><button class="btn ghost" data-act="mDisrupt">Restart timer (disruption)</button></div>`;
  }
  if(M.mode==='listen'){
    return `${head}<section class="panel">${timer}
      <div class="center"><button class="speak" data-consult data-act="say" data-text="${esc(w.key)}" aria-label="Hear the word" ${late}>${SPEAKER}</button></div>
      ${consultBtns}
      ${M.msg?`<div class="note bad">${esc(M.msg)}</div>`:''}
      ${listenPanel()}
    </section>
    <div class="row"><button class="btn ghost" data-act="mDisrupt">Restart timer (disruption)</button></div>`;
  }
  return `${head}<section class="panel">${timer}
      <div class="note" style="text-align:center">
        <span class="eyebrow">Judge's card</span>
        <div class="judge-word ${M.show?'':'hidden'}" id="jw">${showWord(w)}</div>
        <button class="link" data-act="mShow">${M.show?'Hide word':'Show word to judge'}</button>
      </div>
      ${consultBtns}
      <span class="eyebrow">Mark the answer</span>
      <div class="outcomes">${Object.entries(OUTCOMES).map(([k,o])=>`<button class="oc ${o.pts>0?'plus':'minus'}" data-act="mJudge" data-o="${k}"><span>${o.label}</span><span class="pts">${o.pts>0?'+':''}${o.pts}</span></button>`).join('')}</div>
      <details><summary>What counts as wrong procedure?</summary><ul>
        <li>Not following Say–SPELL–Say, including when correcting</li>
        <li>Talking with a teammate after the 20-second signal</li>
        <li>Teammate prompting, mouthing or spelling along</li>
        <li>Sounding out syllables (S-I-G "sig" …)</li>
        <li>Fillers like um, uh, ah while spelling</li>
        <li>Hurriedly repeating letters</li>
        <li>A speller may restart only before saying the last letter, and must Say–SPELL–Say again</li>
      </ul></details>
    </section>
    <div class="row"><button class="btn ghost" data-act="mDisrupt">Restart timer (disruption)</button></div>`;
}
function mResult(outcome, answer){
  if(M.done) return;
  stopTimer();
  const w = curWord(), pts = OUTCOMES[outcome].pts;
  M.done = {outcome, pts, answer};
  M.rounds[M.r].results.push({w, outcome, pts, answer});
  render();
}
function mSolo(val, timeout){
  const v = norm(val||'');
  if(!v) return mResult('none','');
  mResult(isRight(curWord(), v) ? 'ok' : 'wrong', v);
}
function mHeard(text, err){
  if(!M || view!=='mock' || M.done) return;
  const over = !T || T.phase==='over';
  if(!text){ if(over) return mResult('none',''); M.msg = micError(err); render(); return; }
  const r = parseHeard(text, curWord().answers);
  if(r.noLetters && !over){ M.msg = `I heard “${displayHeard(text, curWord().answers)}” but no separate letters. Tap "Start spelling" and spell with a short pause between letters.`; render(); return; }
  M.heard = r;
  const right = !!r.letters && curWord().answers.includes(r.letters);
  mResult(right ? (r.procOk ? 'ok' : 'proc') : 'wrong', r.letters || text);
}
function mOverride(o){
  const res = M.rounds[M.r].results; const last = res[res.length-1];
  last.outcome = o; last.pts = OUTCOMES[o].pts;
  M.done.outcome = o; M.done.pts = last.pts; render();
}
function mNext(){
  { const d=M.done, w=curWord(); if(d && w.src==='official') record(w.key, d.outcome==='ok'||d.outcome==='proc'); }
  if(M.i+1<PER_ROUND){ M.i++; beginWord(); }
  else { stopTimer(); go('mRound'); }
}
function marksheet(R, rIdx){
  return `<div class="tbl-wrap"><table>
    <tr><th>#</th><th>Word</th><th>List</th><th>Result</th><th class="num">Score</th></tr>
    ${R.results.map((x,k)=>`<tr><td>${k+1}</td><td><span class="w">${esc(x.w.word)}</span>${x.answer&&x.outcome==='wrong'?`<br><span class="muted" style="font-size:.85rem">wrote ${esc(x.answer)}</span>`:''}</td>
      <td>${x.w.src==='hidden'?'<span class="pill honey">Hidden</span>':'<span class="pill">Official</span>'}</td>
      <td><span class="pill ${x.pts>0?'good':x.pts<0?'bad':''}">${esc(OUTCOMES[x.outcome].label)}</span></td>
      <td class="num">${x.pts>0?'+':''}${x.pts}</td></tr>`).join('')}
    <tr><td colspan="4"><b>Round ${rIdx+1} total</b></td><td class="num">${roundScore(R)}</td></tr>
  </table></div>`;
}
function vMockRound(){
  const R = M.rounds[M.r], cum = cumScore();
  let next = '';
  if(M.r===0) next = `<button class="btn big" data-act="mRoundNext">Start Round 2</button>`;
  else if(M.r===1){
    next = cum>=QUALIFY
      ? `<div class="note good"><b>Qualified!</b> ${cum} points is at least ${QUALIFY}. At the real event, the top 3 teams in each grade with ${QUALIFY}+ go through.</div><button class="btn big" data-act="mRoundNext">Start Round 3</button>`
      : `<div class="note bad"><b>${cum} points.</b> Round 3 needs at least ${QUALIFY} after Round 2, so the mock ends here.</div><button class="btn big" data-act="mFinish">See final marksheet</button>`;
  } else next = `<button class="btn big" data-act="mFinish">See final marksheet</button>`;
  return `
  <section class="hero"><span class="eyebrow">Round ${M.r+1} marksheet</span><h1>Round ${M.r+1}: ${roundScore(R)} points</h1>
  <div class="scorebox"><div><span class="eyebrow">This round</span><b>${roundScore(R)}</b></div><div><span class="eyebrow">Cumulative</span><b>${cum}</b></div><div><span class="eyebrow">Best possible</span><b>${PER_ROUND*2}</b></div></div></section>
  <section class="panel">${marksheet(R, M.r)}</section>
  <div class="row" style="flex-direction:column;align-items:stretch;gap:12px">${next}</div>`;
}
function finishMock(){
  const p = prof();
  const rounds = M.rounds.map(roundScore), total = cumScore();
  const qualified = M.rounds.length>=3;
  p.mocks.push({date:new Date().toISOString(), mode:M.mode, rounds, total, qualified});
  save(); go('mFinal');
}
function vMockFinal(){
  const total = cumScore();

  <section class="hero"><span class="eyebrow">Mock bee complete</span><h1>Final score: ${total}</h1>
  <div class="scorebox">${M.rounds.map((r,i)=>`<div><span class="eyebrow">Round ${i+1}</span><b>${roundScore(r)}</b></div>`).join('')}<div><span class="eyebrow">Total</span><b>${total}</b></div></div></section>
  ${M.rounds.map((r,i)=>`<section class="panel"><h3>Round ${i+1}</h3>${marksheet(r,i)}</section>`).join('')}
  ${missed.length?`<section class="panel"><h3>Practise these</h3><p class="muted">Official-list misses are now marked tricky.</p>
    <div class="bank">${missed.map(x=>`<button class="bw" data-act="say" data-text="${esc(x.w.key)}"><span>${esc(x.w.word)}</span><span class="st tricky"></span></button>`).join('')}</div></section>`:''}
  <p class="muted" style="font-size:.9rem">In a real tie, teams play SpellTok tiebreaker rounds. Those scores don't count toward the total.</p>
  <div class="row"><button class="btn big" data-act="mSetup">New mock bee</button><button class="btn alt" data-act="home">Home</button></div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  switch(a){
    case 'home': if(view==='mock'||view==='practice') return; go('home'); break;
    case 'who': S.active=b.dataset.id; save(); go('home'); break;
    case 'say': sayWord(b.dataset.text); break;
    case 'saySlow': sayWord(b.dataset.text, true); break;
    case 'tts': speak(b.dataset.text); break;
    case 'readMeaning': readMeaning(b.dataset.k); break;
    case 'meaning': { const m=$('#meaning'); if(m) m.hidden=!m.hidden; break; }
    case 'speller': go('speller'); break;
    case 'saveSpeller': {
      const p=S.profiles.find(x=>x.id===b.dataset.id);
      p.name=($('#n-'+p.id).value.trim()||p.name); p.grade=Number($('#g-'+p.id).value); save();
      renderWho(); $('#msg-'+p.id).textContent='Saved.'; break;
    }
    case 'delSpeller': {
      if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to remove'; return; }
      S.profiles=S.profiles.filter(x=>x.id!==b.dataset.id);
      if(!S.profiles.find(x=>x.id===S.active)) S.active=S.profiles[0].id;
      save(); go('speller'); break;
    }
    case 'addSpeller': {
      const id='p'+Date.now().toString(36);
      S.profiles.push({id,name:'New speller',grade:3,stats:{},mocks:[]}); save(); go('speller'); break;
    }
    case 'bank': go('bank'); break;
    case 'bankFilter': bankFilter=b.dataset.k; render(); break;
    case 'pSetup': go('pSetup'); break;
    case 'pOpt': S.settings[b.dataset.o]=b.dataset.v; save(); render(); break;
    case 'pStart': startPractice(); break;
    case 'pLetter': {
      const c=b.dataset.l, cur=S.settings.pLetters||'';
      S.settings.pLetters = !c ? '' : cur.includes(c) ? cur.replace(c,'') : [...cur+c].sort().join('');
      save(); render(); break;
    }
    case 'pCheck': {
      const v=$('#spell').value; if(!norm(v)) return;
      const w=P.q[P.i]; P.attempt=norm(v);
      if(isRight(w,v)){ P.right++; P.phase='right'; record(w.key,true); }
      else { P.phase='wrong'; P.missed.push(w); record(w.key,false); }
      render(); break;
    }
    case 'pGiveUp': { const w=P.q[P.i]; P.attempt=''; P.phase='wrong'; P.missed.push(w); record(w.key,false); render(); break; }
    case 'pRetype': {
      const v=$('#spell').value;
      if(isRight(P.q[P.i],v)) pAdvance();
      else { $('#retypemsg').textContent='Not yet. Look at the tiles and try again.'; $('#spell').select(); }
      break;
    }
    case 'pReveal': P.phase='reveal'; render(); break;
    case 'pSelf': { const w=P.q[P.i], ok=b.dataset.ok==='1'; record(w.key,ok); if(ok)P.right++; else P.missed.push(w); pAdvance(); break; }
    case 'pNext': pAdvance(); break;
    case 'micStart': startListening(view==='mock' ? mHeard : pHeard); break;
    case 'micStop': stopListening(false); break;
    case 'pMicNext': { const w=P.q[P.i], ok=!!P.heard.letters && w.answers.includes(P.heard.letters); record(w.key, ok); if(ok)P.right++; else P.missed.push(w); pAdvance(); break; }
    case 'pMicAgain': P.phase='ask'; P.heard=null; render(); break;
    case 'pMicOverride': { const w=P.q[P.i]; record(w.key,true); P.right++; pAdvance(); break; }
    case 'pDone': go('pDone'); break;
    case 'mSetup': go('mSetup'); break;
    case 'mOpt': S.settings.mMode=b.dataset.v; save(); render(); break;
    case 'mStart': startMock(); break;
    case 'mShow': M.show=!M.show; $('#jw').classList.toggle('hidden',!M.show); b.textContent=M.show?'Hide word':'Show word to judge'; break;
    case 'mJudge': mResult(b.dataset.o, ''); break;
    case 'mOverride': mOverride(b.dataset.o); break;
    case 'mSubmit': mSolo($('#spell').value); break;
    case 'mDisrupt': stopListening(true); M.msg=''; render(); startTimer(); document.querySelectorAll('[data-consult]').forEach(x=>x.disabled=false); { const ph=$('#phase'); if(ph){ph.textContent='Consult and ask questions';ph.className='phase';} } sayWord(curWord().key); break;
    case 'mNext': mNext(); break;
    case 'mRoundNext': M.r++; M.i=0; M.rounds.push(buildRound()); go('mock'); beginWord(); break;
    case 'mFinish': finishMock(); break;
    case 'mQuit':
      if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to quit'; return; }
      stopTimer(); M=null; go('home'); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const t = e.target.closest('[data-enter]'); if(t){ e.preventDefault(); const b=document.querySelector(`[data-act="${t.dataset.enter}"]`); if(b) b.click(); return; }
  const nb = $('#nextbtn'); if(nb && document.activeElement.tagName!=='BUTTON'){ e.preventDefault(); nb.click(); }
});
document.addEventListener('change', e=>{
  const k = e.target.dataset.change;
  if(k==='accent'){ S.settings.accent=e.target.value; save(); }
  if(k==='voice'){ S.settings.voice=e.target.value; save(); }
  if(k==='rate'){ S.settings.rate=Number(e.target.value); save(); }
});
document.addEventListener('input', e=>{
  if(e.target.dataset.input==='bankq'){
    bankQ=e.target.value; const pos=e.target.selectionStart;
    render(); const i=$('#bankq'); i.focus(); i.setSelectionRange(pos,pos);
  }
});
render();
</script>
</body></html>
